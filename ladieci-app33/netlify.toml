[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# ENV_SPLIT_V1_15 — config V1 staging SCOPED AL BRANCH (solo backup/v1-...).
# Netlify usa QUESTO file come config attiva quando base=ladieci-app33 (il root
# netlify.toml serve solo per la base — verificato con `netlify build --dry`).
#
# ALLOW_V1: il sito V1 builda il backup branch come production branch →
# CONTEXT=production → guard-no-lab-markers bloccherebbe (marker V1 in src).
#
# Le 6 var sotto sono NON-SEGRETE (URL pubblici + publishable anon key, che
# finiscono comunque nel bundle browser): le mettiamo qui perché lo store env
# del sito V1 non viene iniettato nel build git-linked (le var risultano assenti
# al build → guard-env-fail-closed → exit 2). Qui sono deterministiche.
# I SEGRETI veri (JWT_SECRET, RAILWAY_API_KEY) restano nello store, NON qui.
#
# ⚠️ SOLO su questo branch. La produzione vera builda da main (senza questo file)
# e non è git-linked → non può ereditare nulla di tutto questo. NON portare su main.
[build.environment]
  ALLOW_V1 = "1"
  # No publicar source maps en staging: el .map conservaría los literales de
  # fallback prod (URLs públicas, no secretos) de los `process.env.X || "prod"`.
  # Con sourcemaps off el artefacto desplegado queda 100% sin refs prod.
  GENERATE_SOURCEMAP = "false"
  REACT_APP_SUPABASE_URL = "https://tdikhfeinufaahagmpjz.supabase.co"
  REACT_APP_SUPABASE_ANON_KEY = "sb_publishable_qMYSRpFm1TQ4S04nD8Bw3Q_7Fc92qaS"
  REACT_APP_BACKEND_API_URL = "https://fearless-reverence-production-80bc.up.railway.app"
  # V3-H Mesa UI is compiled only into this staging branch. Production builds
  # without the exact lowercase flag keep the existing Barra tab.
  REACT_APP_MESA_ENABLED = "true"
  BACKEND_API_URL = "https://fearless-reverence-production-80bc.up.railway.app/api"
  SUPABASE_URL = "https://tdikhfeinufaahagmpjz.supabase.co"
  SUPABASE_ANON_KEY = "sb_publishable_qMYSRpFm1TQ4S04nD8Bw3Q_7Fc92qaS"

# S2-7D2 — canonical operational login. Same-origin proxy to the staging Railway Auth V2
# route, which verifies auth_actors.pin_hash and returns an {actor, role, session_version}
# token. MUST stay above the retired /api/auth rule so it is matched first.
[[redirects]]
  from = "/api/auth/v2/login"
  to = "https://fearless-reverence-production-80bc.up.railway.app/api/auth/v2/login"
  status = 200
  force = true

# RETIRED legacy login — kept only as a fail-closed 410 stub (see netlify/functions/auth.js).
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/api"
  status = 200

# S2-7C2 — customer ACCOUNT boundary. Same-origin proxy to the staging Railway
# backend's Supabase-Bearer account route. Netlify forwards the request
# Authorization header (the customer's Supabase access token) to the backend, so
# the browser never talks cross-origin. Staging backend URL is hardcoded here on
# purpose (this branch is staging-only, like the URLs above).
[[redirects]]
  from = "/api/account/*"
  to = "https://fearless-reverence-production-80bc.up.railway.app/api/account/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

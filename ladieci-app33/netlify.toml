[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# /api/auth is served by the auth Function itself (config.path in
# netlify/functions/auth.mjs), ahead of redirects; no rewrite needed here.

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
